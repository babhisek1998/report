<div class="main_container">
  <div class="header">
    <p class="header_font">Language Update</p>
  </div>
  <div class="header_option">
    <!-- <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="flexRadioDefault"
        id="flexRadioDefault1"
        (click)="openDaterange()"
        checked
      />
      <label class="form-check-label" for="flexRadioDefault1">
        Search by Date range
      </label>
    </div> -->
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="flexRadioDefault"
        id="flexRadioDefault2"
        (click)="openSerialNumberSearch()"
        checked
      />
      <label class="form-check-label" for="flexRadioDefault2">
        Search by Serial Number
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="flexRadioDefault"
        id="flexRadioDefault2"
        (click)="openVpaIdSearch()"
      />
      <label class="form-check-label" for="flexRadioDefault2">
        Search by VPA ID
      </label>
    </div>
  </div>
  @if(dateRange === true){
    <form [formGroup]="languageForm">
        <div class="form-row align-items-center row">
          <div class="col-auto col-md-3">
            <p>Start Date</p>
            <mat-form-field appearance="outline">
              <mat-label>MM/DD/YYYY</mat-label>
              <input matInput [matDatepicker]="picker" formControlName="startDate">
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-auto col-md-3">
            <p>End Date</p>
            <mat-form-field appearance="outline">
              <mat-label>MM/DD/YYYY</mat-label>
              <input matInput [matDatepicker]="picker1" formControlName="endDate" >
              <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
              <mat-datepicker #picker1></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-auto col-md-2">
            <button type="button" class="btn btn-custom mb-2" (click)="showTable()">Submit</button>
          </div>
          <div class="col-auto col-md-2">
            <button type="reset" class="btn btn-custom1 mb-2">Reset</button>
          </div>
        </div>
      </form>

    }
  @if(serialNumberSearch === true){
    <form>
        <p class="heading2">Search any device</p>
        <div class="form-row1">
          <mat-form-field class="matformfield_input" appearance="outline">
            <mat-label>Serial Number</mat-label>
            <input  matInput type="text" placeholder="Search..." />
            <div mat-icon-button matSuffix [attr.aria-label]="'Search'">
              <mat-icon class="icon">search</mat-icon>
            </div>
          </mat-form-field>
    
          <div class="col-auto">
            <button type="submit" class="btn btn-custom3 mb-2" (click)="showTable()">Submit</button>
          </div>
        </div>
      </form>

  }
  @if(vpaIdSearch === true){
    <form>
        <p class="heading2">Search any device</p>
        <div class="form-row1">
          <mat-form-field class="matformfield_input" appearance="outline">
            <mat-label>VPI ID</mat-label>
            <input  matInput type="text" placeholder="Search..." />
            <div mat-icon-button matSuffix [attr.aria-label]="'Search'">
              <mat-icon class="icon">search</mat-icon>
            </div>
          </mat-form-field>
    
          <div class="col-auto">
            <button type="submit" class="btn btn-custom3 mb-2" (click)="showTable()">Submit</button>
          </div>
        </div>
      </form>
  } 
  @if(dataForTable.length !== 0 && showTableData){
    <ng-container >
        <app-data-table [tableData]="dataForTable" [columnss]="columns" [component]="component" ></app-data-table>
    </ng-container>
  }

</div>
