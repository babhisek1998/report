<div class="search_download_div">
  <div class="input-group mb-3" >
    <mat-icon class="icon">search</mat-icon>
  <input
    matInput
    type="text"
    placeholder="Search"
    #input
    (keyup)="applyFilter($event)"
    placeholder="Search"
    aria-label="Search"
    aria-describedby="basic-addon1"
    class="input_class"
  />
</div>

  <div>
    <button class="btn-custom">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12 16L7 11L8.4 9.55L11 12.15V4H13V12.15L15.6 9.55L17 11L12 16ZM6 20C5.45 20 4.97933 19.8043 4.588 19.413C4.19667 19.0217 4.00067 18.5507 4 18V15H6V18H18V15H20V18C20 18.55 19.8043 19.021 19.413 19.413C19.0217 19.805 18.5507 20.0007 18 20H6Z"
          fill="#FF6B11"
        />
      </svg>
      Export as CSV
    </button>
  </div>
</div>

<div class="mat-elevation-z8 table-container">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container
      [matColumnDef]="column"
      *ngFor="let column of displayedColumns"
    >
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        <span class="colnamme customFontn">{{ column }}</span>
      </th>
      <td mat-cell *matCellDef="let row" class="customFontn">
        <div
          *ngIf="column != 'actions'"
          class="rwostylll"
          matTooltipClass="customTooltip"
          #tooltip="matTooltip"
          cdkScrollable
          [matTooltip]="row[column]"
          matTooltipPosition="above"
        >
          <mat-icon
            class="green-dot"
            *ngIf="column == 'STATUS' && row[column] == 'Active'"
            >fiber_manual_record</mat-icon
          >
          <mat-icon
            class="red-dot"
            *ngIf="column == 'STATUS' && row[column] == 'InActive'"
            >fiber_manual_record</mat-icon
          >
          {{ row[column] }}
        </div>
        <div
          *ngIf="column == 'Action' && showAction"
          class="rwostylll"
          matTooltipClass="customTooltip"
          #tooltip="matTooltip"
          cdkScrollable
          [matTooltip]="row[column]"
          matTooltipPosition="above"
        >
          <ng-container stickyEnd>
            <td  style="text-align: center">
              <p
                mat-button
                style="color: #ff6b11"
                (click)="performAction(row)"
              >
                change
            </p>
            </td>
          </ng-container>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">
        No data matching the filter "{{ input.value }}"
      </td>
    </tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 25, 100]"
    aria-label="Select page of users"
  ></mat-paginator>
</div>
