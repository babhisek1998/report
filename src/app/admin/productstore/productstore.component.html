<div class="container">
    <h2>Product Search</h2>

    <div class="search-box">
        <input type="text" [(ngModel)]="userId" placeholder="Enter User ID" />
        <button (click)="searchProductById()">Search</button>
    </div>

    <div *ngIf="products.length > 0" class="mt-4">
        <div class="product-grid">
            <div *ngFor="let product of products" class="product-card">
                <img [src]="product.primaryImageURL || 'assets/default-product.jpg'" [alt]="product.productName" class="product-image" />
                <div class="product-details">
                    <h3>{{ product.productName }}</h3>
                    <p class="brand">Brand: {{ product.brand }}</p>
                    <p class="category">Category: {{ product.categoryName }} ({{ product.parentCategoryName }})</p>
                    <p class="description">{{ product.productDescription }}</p>
                    <p class="price">₹{{ product.price }}</p>
                    <button class="edit-button" (click)="editProduct(product)">
                        ✏️ Edit
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
