<ng-container *ngIf="page == 'products'">
  <!-- <mat-toolbar class="toolbar">
    <span>Users</span>
    <span class="spacer"></span>
  </mat-toolbar> -->
  <form [formGroup]="searchForm">
    <mat-card class="search-card">
      <mat-tab-group (selectedTabChange)="onTabChange($event)">
        <!-- SEARCH SINGLE USER -->
        <mat-tab label="SEARCH SINGLE USERID">
          <div class="search-section">
            <mat-form-field appearance="outline">
              <mat-label>Search by User ID</mat-label>
              <input matInput placeholder="Enter User ID" formControlName="username">
              <mat-error *ngIf="searchForm.controls['username'].invalid">{{ getErrorMessage() }}</mat-error>
            </mat-form-field>

            <div class="button-group mt-2">
              <button mat-raised-button class="login-button" (click)="searchsingleuser()" [disabled]="!searchForm.valid">
                Search
              </button>
              <button mat-raised-button color="warn" (click)="reset()">
                Reset
              </button>
            </div>
          </div>
        </mat-tab>

        <!-- SEARCH ALL USERS -->
        <mat-tab label="SEARCH ALL USERID"></mat-tab>
      </mat-tab-group>
    </mat-card>
  </form>
</ng-container>

<!-- Data Table Section -->
<ng-container *ngIf="page == 'products'">
  <div *ngIf="res_data && res_data.length > 0">
    <app-dtable 
      [reports]="res_data" 
      [index_value]="index_value" 
      [index]="index" 
      [page]="'products'" 
      [visibleCols]="3" 
      (u_detail)="page=$event" 
      [columns]="columns">
    </app-dtable>
  </div>

  <!-- No Data Found -->
  <div *ngIf="noDataFound" class="no-data-container">
    <img src="../../../assets/reports/empty-box.png" alt="No Data Found" class="no-data-image">
    <p>No Data Found</p>
  </div>
</ng-container>
