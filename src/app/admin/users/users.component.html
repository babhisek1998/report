

<ng-container *ngIf="page == 'products'">
    <form [formGroup]="searchForm">
        <div class="card p-3">
            <div class="row">
              <div class="col-md-12">
              <mat-tab-group (selectedTabChange)="onTabChange($event)">
              <mat-tab label="SEARCH SINGLE USERID">
                 <div class="form mt-3">
                  <mat-form-field appearance="outline">
                  <mat-label>Search By userId</mat-label>
                  <input matInput placeholder="Enter UserId" formControlName="username">
                  <mat-error *ngIf="searchForm.controls['username'].invalid">{{getErrorMessage()}}</mat-error>
                  </mat-form-field>
                   <!-- Submit Button -->
                   <div class="form-group">
                     <button type="button" class="btn" (click)="searchsingleuser()" [ngClass]="!searchForm.valid ? 'disbtnp' : 'submit_btn'" [disabled]="!searchForm.valid">Search</button>
                        <button type="button" class="btn submit_rest" (click)="reset()">Reset</button>
                    </div>
                  </div>
                 </mat-tab>
                 <mat-tab label="SEARCH ALL USERID">
                 </mat-tab>
              </mat-tab-group>
              </div>
            </div>
        </div>
    </form>
  </ng-container>
 
  <ng-container *ngIf="page == 'products'">
      <!-- Data Table -->
      <div *ngIf="res_data && res_data.length > 0">
        <app-dtable [reports]="res_data" [index_value]="index_value" [index]="index" [page]="'products'" [visibleCols]="3" (u_detail)="page=$event"
            [columns]="columns">
        </app-dtable>
      </div>
      <!-- No Data Found -->
      <div *ngIf="noDataFound" class="no-data-container text-center mt-5">
        <img src="../../../assets/reports/empty-box.png" alt="No Data Found" class="no-data-image mb-3">
        <p>No Data Found</p>
      </div>
  </ng-container>
