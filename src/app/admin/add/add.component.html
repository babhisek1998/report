<mat-tab-group>
    <mat-tab label="Basic Details">
      <div class="container">
        <!-- Sidebar for media upload -->
        <div class="media-sidebar">
          <div class="media-box">
            <button mat-button class="media-btn">
              <mat-icon>photo_camera</mat-icon> Add Photo
            </button>
          </div>
          <div class="media-box">
            <button mat-button class="media-btn">
              <mat-icon>videocam</mat-icon> Add Video
            </button>
          </div>
          <div class="media-box">
            <button mat-button class="media-btn">
              <mat-icon>picture_as_pdf</mat-icon> Add PDF
            </button>
          </div>
        </div>
  
        <!-- Form section -->
        <div class="form-section">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Product/Service Name</mat-label>
            <input matInput>
          </mat-form-field>
  
          <div class="price-container">
            <mat-form-field appearance="outline" class="price-field">
              <mat-label>Price</mat-label>
              <input matInput>
            </mat-form-field>
            <span class="unit-text">per -</span>
            <mat-form-field appearance="outline" class="unit-field">
              <input matInput placeholder="Enter Unit">
            </mat-form-field>
          </div>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Product/Service Description</mat-label>
            <textarea matInput rows="5"></textarea>
          </mat-form-field>
        </div>
      </div>
    </mat-tab>
  </mat-tab-group>
  
  <!-- Save and Continue Button -->
  <div class="button-container">
    <button mat-raised-button color="primary">Save and Continue</button>
  </div>
