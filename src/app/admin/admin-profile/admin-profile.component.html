<div class="main_container">
    <div class="heading">
      <div class="back-icon">
        <mat-icon (click)="goToDashboard()">keyboard_backspace</mat-icon>
      </div>
      <div class="header mathfont">User Profile</div>
    </div>
    <div class="sub_head">
      <p>Your personal information and device details</p>
      @if(isReadonly){
      <button type="button" class="btn edit_btn" (click)="openEdit()">
        Edit
      </button>
      }
    </div>
    <div class="image_details">
      <div class="profile_img">
        <img
          src="../../../assets/images/merchant/profileImg.png"
          class="rounded-circle mt-4 profile_img"
        />
      </div>
    </div>
    <div class="name_tag">
      <p>{{username}}</p>
    </div>
    <div class="sub_heading my-1">
      <p class="mathfont sub_head2">Personal Details</p>
    </div>
    <div [formGroup]="userForm" class="userData">
      <div class="row">
        <div class="col-md-6 my-1">
          <div class="form-group">
            <label for="exampleInputEmail1" class="mb-2 lable_tag">Name</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter Your Name"
              formControlName="name"
              [readonly]="isReadonly"
            />
          </div>
        </div>
        <div class="col-md-6 my-1">
          <div class="form-group">
            <label for="exampleInputEmail1" class="mb-2 lable_tag">Mobile Number</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter Mobile No."
              formControlName="phNo"
              [readonly]="isReadonly"
            />
          </div>
        </div>
        <div class="col-md-6 my-1">
          <div class="form-group">
            <label for="exampleInputEmail1" class="mb-2 lable_tag">Email address</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter email"
              formControlName="email"
              [readonly]="isReadonly"
            />
          </div>
        </div>
        <div class="col-md-6 my-1">
          <div class="form-group">
            <label for="exampleInputEmail1" class="mb-2 lable_tag">Address</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter address"
              formControlName="address"
              [readonly]="isReadonly"
            />
          </div>
        </div>
      </div>

        @if(!isReadonly){
        <div class="btns mt-2">
          <button type="button" class="btn save_btn" (click)="saveData()">
            Save
          </button>
          <button type="button" class="btn cancel_btn">Cancel</button>
        </div>
        }
      </div>
  </div>
