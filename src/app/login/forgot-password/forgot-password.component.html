<div class="container1">
  <div class="row col-12 col-md-12">
    <div class="col-md-7">
      <div class="form_signin">
        <h3 class="Start_header">Forgot your password</h3>
        <p class="text-custom1">
          Lost your password? No worries. Enter your phone number, and we'll
          help you reset it .
        </p>
        <form [formGroup]="forgetPassForm">
          <div class="mb-2">
            <label class="mt-2"
              >Username<span class="text-danger">*</span></label
            >
            <div class="input-group">
              <input
                type="text"
                noWhitespace
                placeholder="Enter Your Username"
                formControlName="username"
                class="form-control input_form mt-2"
                autocomplete="off"
                maxlength="50"
              />
            </div>

            @if(forgetPassForm.get('username')?.invalid &&
            forgetPassForm.get('username')?.touched){
            <small class="text-danger ml-1 errmsg pstntext">
              Please Enter Valid Username
            </small>
            }
          </div>
          <div class="d-flex justify-content-between mt-4">
            <button
              class="btn btn-custom text-white form-control"
              (click)="sendForgotPswOtp()"
              [disabled]="forgetPassForm.invalid"
            >
              @if(!loading){<span>Reset</span>} @if(loading){<span
                ><img [src]="loaderImg" class="loader" alt="loader" />Please
                wait..</span
              >}
            </button>
          </div>
          <div class="Remembered_pw">
            <p>
              Remembered Password?
              <span class="login-link" (click)="gotoLogin()">Log In</span>
            </p>
          </div>
        </form>
      </div>
    </div>

    <div class="col-md-5">
      <div id="fade" class="d-flex justify-content-center">
        <div class="text-center">
          <div class="d-flex justify-content-center">
            <p class="forgetlogo"></p>
          </div>
          <p class="Forgetbackgroundimage"></p>
        </div>
      </div>
    </div>
  </div>
</div>
